<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Native CRM · 架构学习 Wiki</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root { --theme-color: #235fa4; }
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .sidebar { width: 310px; }
    .content { left: 310px; }
    .markdown-section { max-width: 960px; padding: 35px 40px 80px; }
    .markdown-section img { max-width: 100%; border-radius: 8px; }
    .markdown-section pre { overflow-x: auto; }
    .sidebar-nav a { white-space: normal !important; line-height: 1.7; }
    @media(max-width: 768px) { .content { left: 0; } .markdown-section { padding: 24px; } }
  </style>
</head>
<body>
  <div id="app">正在加载架构 Wiki…</div>
  <script>
    window.$docsify = {
      name: 'AI Native CRM · 架构 Wiki',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      search: { placeholder: '搜索架构与 Agent 章节', noData: '未找到相关章节', depth: 3 },
      alias: { '/.*/_sidebar.md': '/_sidebar.md' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
