    - heading [level=3] [ref=f1e247]:
      - link "核心命题：什么算\"事实\"" [ref=f1e248] [cursor=pointer]:
        - /url: "#/pages/01?id=%e6%a0%b8%e5%bf%83%e5%91%bd%e9%a2%98%ef%bc%9a%e4%bb%80%e4%b9%88%e7%ae%97quot%e4%ba%8b%e5%ae%9equot"
    - paragraph [ref=f1e249]: 所谓"事实底座"，在本仓库中不是一句口号，而是由代码强制的三条规则。
    - paragraph [ref=f1e250]:
      - strong [ref=f1e251]: 第一，事实只存在于 Postgres 里。
      - text: 系统把
      - code [ref=f1e252]: event_log
      - text: 当作事件溯源的唯一入口，Postgres 触发器
      - strong [ref=f1e253]: 永不
      - text: 发起 HTTP 调用——触发器只写入一行事件，由 worker 消费并产生副作用
      - link "CLAUDE.md" [ref=f1e254] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/CLAUDE.md#L49
      - text: 。这条禁令消灭了"数据库里发生了一件事，但外部世界不知道"这一整类不一致状态。事实源是数据库，副作用是派生。
    - paragraph [ref=f1e255]:
      - strong [ref=f1e256]: 第二，事实的读取必须带租户作用域。
      - text: 所有 tenant-aware 表都带
      - code [ref=f1e257]: organization_id uuid not null
      - text: ，行级安全（RLS）通过
      - code [ref=f1e258]: fn_user_org_ids()
      - text: 辅助函数统一施加
      - link "ARCHITECTURE.md" [ref=f1e259] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/ARCHITECTURE.md#L10
      - text: 。智能体能读到哪条客户记录，取决于它以谁的身份被调用，而不是取决于模型"想"看什么。
    - paragraph [ref=f1e260]:
      - strong [ref=f1e261]: 第三，事实的写入必须留痕。
      - text: 每一次成功的 POST/PATCH/DELETE 都会产生一条
      - code [ref=f1e262]: api_audit_log
      - text: 记录，且该表对
      - code [ref=f1e263]: anon
      - text: 、
      - code [ref=f1e264]: authenticated
      - text: 、
      - code [ref=f1e265]: service_role
      - strong [ref=f1e266]: 都没有
      - text: UPDATE/DELETE/TRUNCATE 授权——连 service_role 也没有
      - link "CLAUDE.md" [ref=f1e267] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/CLAUDE.md#L89
      - text: 。这是从 schema 层保证的，不是靠提示词或纪律维持的。
    - paragraph [ref=f1e268]:
      - text: 这三条共同构成了"底座"：
      - strong [ref=f1e269]: 智能体的每一个认知都源自数据库，每一次状态改变都写回数据库并被审计
      - text: 。智能体本身是无状态的执行器，状态全部沉淀在 CRM 里。
    - separator [ref=f1e270]
    - heading [level=3] [ref=f1e271]:
      - link "智能体回合的四层契约" [ref=f1e272] [cursor=pointer]:
