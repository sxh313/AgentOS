  - article [ref=f1e111]:
    - heading [level=1] [ref=f1e112]:
      - link "01 从客户问题开始认识 AI Native CRM" [ref=f1e113] [cursor=pointer]:
        - /url: "#/pages/01?id=_01-%e4%bb%8e%e5%ae%a2%e6%88%b7%e9%97%ae%e9%a2%98%e5%bc%80%e5%a7%8b%e8%ae%a4%e8%af%86-ai-native-crm"
    - paragraph [ref=f1e114]:
      - link "返回母文档" [ref=f1e115] [cursor=pointer]:
        - /url: "#/README"
      - text: ·
      - link "下一章" [ref=f1e116] [cursor=pointer]:
        - /url: "#/pages/02"
    - paragraph [ref=f1e117]:
      - strong [ref=f1e118]: 本章目标：
      - text: 理解 CRM、Agent、模型与人的职责，区分事实和建议。
    - heading [level=2] [ref=f1e119]:
      - link "业务流程与阅读起点" [ref=f1e120] [cursor=pointer]:
        - /url: "#/pages/01?id=%e4%b8%9a%e5%8a%a1%e6%b5%81%e7%a8%8b%e4%b8%8e%e9%98%85%e8%af%bb%e8%b5%b7%e7%82%b9"
    - paragraph [ref=f1e121]: 你会学到：这个项目服务谁，CRM 与 Agent 怎样配合，以及怎样区分代码、运行记录和演示界面。
    - paragraph [ref=f1e122]: AI Native CRM 是一个可自行部署的客户关系管理系统。它把联系人、客户会话、商机、跟进任务和组织知识放在同一套系统中，再让 Agent 在权限范围内读取资料、分析问题、提出操作。仓库和内部模块也使用 Pi Native CRM 这个名称。
    - paragraph [ref=f1e123]: 先想一个具体问题：销售经理希望知道“这笔商机为什么停住了，下一步应该做什么”。传统 CRM 保存客户信息、当前阶段、聊天历史和待办。Agent 读取这些记录，找出可引用的依据，再给出摘要或建议。CRM 负责业务事实与权限；模型负责有边界的推理。两者不是彼此替代。
    - paragraph [ref=f1e124]:
      - img "客户工作从事实记录走向辅助判断" [ref=f1e125]
    - paragraph [ref=f1e126]: 图中实线表示正常业务信息的流动，虚线表示需要人复核的建议。生成一段“建议回复”不会自动产生客户消息。
    - heading [level=3] [ref=f1e127]:
      - link "先分清四个责任" [ref=f1e128] [cursor=pointer]:
        - /url: "#/pages/01?id=%e5%85%88%e5%88%86%e6%b8%85%e5%9b%9b%e4%b8%aa%e8%b4%a3%e4%bb%bb"
    - paragraph [ref=f1e129]: 在 AI Native CRM 中，不能把所有智能化能力笼统归为“AI 做的”。系统由明确的四方职责共同驱动：
    - table [ref=f1e130]:
      - rowgroup [ref=f1e131]:
        - row [ref=f1e132]:
          - columnheader "角色" [ref=f1e133]
          - columnheader "它拥有什么？" [ref=f1e134]
          - columnheader "它能执行什么？" [ref=f1e135]
          - columnheader "核心代码锚点" [ref=f1e136]
      - rowgroup [ref=f1e137]:
        - row [ref=f1e138]:
          - cell [ref=f1e139]:
            - strong [ref=f1e140]: 人类操作员 (Human)
          - cell "业务常识、战略意图与最终责任" [ref=f1e141]
          - cell "发起任务委托、审批外发提案、处理异常" [ref=f1e142]
          - cell [ref=f1e143]:
            - code [ref=f1e144]: app/app/
            - text: 前端交互
        - row [ref=f1e145]:
          - cell [ref=f1e146]:
            - strong [ref=f1e147]: CRM 数据库 (Database)
          - cell "业务事实（唯一真理 SOT）、租户规则" [ref=f1e148]
          - cell "执行 RLS 行级隔离、唯一性约束、记录不可篡改审计日志" [ref=f1e149]
          - cell [ref=f1e150]:
            - code [ref=f1e151]: supabase/migrations/
        - row [ref=f1e152]:
          - cell [ref=f1e153]:
            - strong [ref=f1e154]: 智能体运行时 (Pi Agent)
          - cell "任务分解逻辑、回合控制、上下文生命周期" [ref=f1e155]
          - cell "编排工具调用循环、拦截高危操作、生成结构化结果" [ref=f1e156]
          - cell [ref=f1e157]:
            - code [ref=f1e158]: lib/agent-runtime/pi/
        - row [ref=f1e159]:
          - cell [ref=f1e160]:
            - strong [ref=f1e161]: 大语言模型 (LLM)
          - cell "语言理解、上下文推理与拟人生成能力" [ref=f1e162]
          - cell "提出下一步建议、生成草案、决定调用哪个受控工具" [ref=f1e163]
          - cell [ref=f1e164]:
            - code [ref=f1e165]: Model Gateway (BYOK)
    - blockquote [ref=f1e166]:
      - paragraph [ref=f1e167]:
        - text: 📌
        - strong [ref=f1e168]: 核心边界原则：
        - text: 模型输出的永远是推理建议与工具参数，模型
        - strong [ref=f1e169]: 绝不直接获得数据库写权限
        - text: ；任何具有外部副作用的操作必须经由受控工具（Tools）或 HITL 审批流水线完成。
    - paragraph [ref=f1e170]: 遇到一个组件时，先问四件事：它读什么？它能写什么？谁验证这次操作？进程退出后，哪些内容仍然存在？后面的技术栈、Agent 和知识设计都沿这四个问题展开。
    - heading [level=3] [ref=f1e171]:
      - link "第一眼先记住五个入口" [ref=f1e172] [cursor=pointer]:
        - /url: "#/pages/01?id=%e7%ac%ac%e4%b8%80%e7%9c%bc%e5%85%88%e8%ae%b0%e4%bd%8f%e4%ba%94%e4%b8%aa%e5%85%a5%e5%8f%a3"
    - list [ref=f1e173]:
      - listitem [ref=f1e174]: 首页：把客户数量、近期任务、默认漏斗和有权查看的 Agent 活动放到一起。读取失败会显示失败状态，不应把零值当成真数据。
      - listitem [ref=f1e175]: 联系人与商机：联系人描述“这个人”；商机描述“这次业务机会”。一个人和一次机会不是同一个对象。
      - listitem [ref=f1e176]: Inbox：查看渠道会话，回复或记录内部备注。发送受渠道、会话、角色及其他业务规则约束。
      - listitem [ref=f1e177]: Agent–CRM 工作台：选择内置 Agent、任务和 CRM 范围，观察一次运行的工具、证据、结果与评测。
      - listitem [ref=f1e178]: 知识与记忆：知识库提供组织材料；经过确认的记忆保存特定事实。它们必须保留来源与适用范围。
    - paragraph [ref=f1e179]: 项目还有日程、任务、风险雷达、快速回复、统计、组织设置、隐私请求与部署工具。本书先把这些入口放回完整产品中，再重点跟踪 CRM、Agent 和知识三条主线。目录不是“所有按钮都经过本次在线验收”的声明。
    - heading [level=3] [ref=f1e180]:
      - link "从当前新界面认入口" [ref=f1e181] [cursor=pointer]:
        - /url: "#/pages/01?id=%e4%bb%8e%e5%bd%93%e5%89%8d%e6%96%b0%e7%95%8c%e9%9d%a2%e8%ae%a4%e5%85%a5%e5%8f%a3"
    - paragraph [ref=f1e182]: 以下图片于 2026-10-04 从当前公开演示的真实浏览器页面直接截取，使用虚构数据；静态演示没有连接 CRM 后端、模型或真实通信渠道。它们说明界面如何呈现，不是主分支业务功能的在线验收。
    - paragraph [ref=f1e183]:
      - img "当前界面实拍：Agent–CRM 工作台中的只读模拟任务，2026-10-04" [ref=f1e184]
    - paragraph [ref=f1e185]: 工作台把 Agent、目标商机、执行模式、任务结果和记录入口放在同一处。图中任务来自页面的预置样例；「本轮已结束」只代表这一段本地模拟结束，不能据此推断真实模型或业务执行已经成功。
    - paragraph [ref=f1e186]:
      - img "当前界面实拍：四阶段销售漏斗看板，2026-10-04，虚构数据" [ref=f1e187]
    - paragraph [ref=f1e188]: 四列分别是新客户、已联系、方案沟通、已成交。卡片将机会金额、公司、待办和负责人放在一起，帮助你把联系人、商机与跟进任务关联起来。
    - paragraph [ref=f1e189]:
      - img "当前界面实拍：会话收件箱与仅模拟发送的输入区，2026-10-04" [ref=f1e190]
    - paragraph [ref=f1e191]: 左侧选择会话，右侧阅读消息和准备草稿。图中保留「WhatsApp · 示例会话 · 未连接」与「模拟发送」提示；没有发生真实外发。
    - paragraph [ref=f1e192]:
      - img "当前界面实拍：绩效页的销售漏斗与客服表现，2026-10-04，演示数据" [ref=f1e193]
    - paragraph [ref=f1e194]: 统计页展示聚合指标的组织方式。这里的商机数量、会话数和响应时间都属于演示样本，不能用作真实业务成绩。
    - paragraph [ref=f1e195]: 本次使用 9 张当前界面实拍，另在联系人、Inbox、看板、工作台、记忆、知识与 Eval 对应章节放置近景。图片来源清单记录页面、状态、拍摄时间、尺寸与哈希。所有图片未经重绘或像素修改；细节图由浏览器直接截取面板区域。
    - paragraph [ref=f1e196]:
      - text: 演示 Site 固定到第 9 版
      - code [ref=f1e197]: acd09a467d7fa45b410a10e35137fe2d729b52bb
      - text: ，页面显示的接线基线标签为
      - code [ref=f1e198]: 12749ab
      - text: 。这两个标识与下方正文主分支
      - code [ref=f1e199]: 679e09e8
      - text: 是不同口径；截图里出现动效或检查样例，不表示候选改动已经合并。
    - heading [level=3] [ref=f1e200]:
      - link "本书固定在哪个版本" [ref=f1e201] [cursor=pointer]:
        - /url: "#/pages/01?id=%e6%9c%ac%e4%b9%a6%e5%9b%ba%e5%ae%9a%e5%9c%a8%e5%93%aa%e4%b8%aa%e7%89%88%e6%9c%ac"
    - paragraph [ref=f1e202]:
      - text: 正文基线为主分支提交
      - code [ref=f1e203]: 679e09e80878dff7b1c79b8537317b2b9e355331
      - text: "。PR #2 已合并。2026-10-05 再次核验主分支未变化。2026-10-04 核验 PR 时，动效 PR #3 仍为 draft，头提交为"
      - code [ref=f1e204]: 50125afd199de3234d0a2bad3c9e5c434c9c2262
      - text: ；它没有进入本书主线。
    - paragraph [ref=f1e205]:
      - img "区分主分支、实验改动、运行记录和静态演示" [ref=f1e206]
    - paragraph [ref=f1e207]: 四个框是四类证据，不能相互替代。主分支说明“代码是什么”；既有运行记录说明“某个环境在某次执行中发生了什么”；静态演示只说明交互表现；未合并 PR 说明候选改动。
    - paragraph [ref=f1e208]: 本书没有启动真实数据库、调用真实模型或发送渠道消息。后文涉及真实运行成绩时，会明确标成仓库已有验收记录。CodeWiki 自身的图、链接、网页与内容包验证是另一件事。
    - heading [level=3] [ref=f1e209]:
      - link "怎么读更省力" [ref=f1e210] [cursor=pointer]:
        - /url: "#/pages/01?id=%e6%80%8e%e4%b9%88%e8%af%bb%e6%9b%b4%e7%9c%81%e5%8a%9b"
