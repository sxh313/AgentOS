      - text: 这张表最重要的信息是
      - strong [ref=f1e301]: 所有权归属
      - text: ：循环归 Pi，副作用归 CRM。文档用一句话点明——发送、转人工、对外自动化仍然是 CRM 拥有的效果
      - link "agent-turn-pi.md" [ref=f1e302] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/docs/architecture/agent-turn-pi.md#L11
      - text: 。
    - paragraph [ref=f1e303]:
      - text: 侧效应用的是纵深防御，一共有五层同时生效
      - link "agent-turn-pi.md" [ref=f1e304] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/docs/architecture/agent-turn-pi.md#L19
      - text: ：
    - list [ref=f1e305]:
      - listitem [ref=f1e306]: 现有的 CRM 护栏留在能力处理器内部
      - listitem [ref=f1e307]:
        - code [ref=f1e308]: beforeToolCall
        - text: 可以在执行前阻断或终止
      - listitem [ref=f1e309]:
        - code [ref=f1e310]: afterToolCall
        - text: 可以脱敏/替换结果或终止整个回合
      - listitem [ref=f1e311]: 影子模式只允许读取类能力
      - listitem [ref=f1e312]: 租户与 RBAC 检查保留在数据库/API 边界
    - heading [level=4] [ref=f1e313]:
      - link "上下文如何被装配成提示词" [ref=f1e314] [cursor=pointer]:
        - /url: "#/pages/01?id=%e4%b8%8a%e4%b8%8b%e6%96%87%e5%a6%82%e4%bd%95%e8%a2%ab%e8%a3%85%e9%85%8d%e6%88%90%e6%8f%90%e7%a4%ba%e8%af%8d"
    - paragraph [ref=f1e315]:
      - text: 理解了上表之后，
      - code [ref=f1e316]: lib/agent-engine/agent/context-builder.ts
      - text: 的价值才显现——它是"事实"与"语言"之间的翻译层。函数按固定顺序装配出若干文本块：上一个回合的检查点、累积摘要、漏斗状态、线索记忆索引、已标记的日程、最近消息
      - link "context-builder.ts" [ref=f1e317] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/agent-engine/agent/context-builder.ts#L54
      - text: 。
    - paragraph [ref=f1e318]: 其中两处注释揭示了设计者对"事实如何影响模型"的深刻理解，值得逐字读：
    - paragraph [ref=f1e319]:
      - strong [ref=f1e320]: 检查点的时间戳必须被声明。
      - text: 检查点块被放在提示词的
      - strong [ref=f1e321]: 第一位置
      - text: ——高于历史记录，因为模型会把最前面的内容读作"最新指令"。但这个检查点其实是
      - strong [ref=f1e322]: 上一个回合结束时
      - text: 写的，早于客户刚发来的那条消息。注释直说：不说明这点，一个过期的检查点就会赢过与它矛盾的历史记录
      - link "context-builder.ts" [ref=f1e323] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/agent-engine/agent/context-builder.ts#L55
      - text: 。
    - paragraph [ref=f1e324]:
      - strong [ref=f1e325]: 字段名本身会泄漏给模型。
      - text: 漏斗状态块原本叫
      - code [ref=f1e326]: "## Estado do funil (lead_state)"
      - text: ，注释承认这是"免费泄漏"——模型读到表名就会复述它，而复述表名等于打开了第二条泄漏通道
      - link "context-builder.ts" [ref=f1e327] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/agent-engine/agent/context-builder.ts#L69
      - text: 。
    - paragraph [ref=f1e328]:
      - text: 还有一个更微妙的规则：
      - strong [ref=f1e329]: 空字段不是"信息不存在"的证据
      - text: 。当
      - code [ref=f1e330]: contact.email
      - text: 为空时，不把它当作事实呈现，因为模型会以"档案权威"的态度读取它，赢过客户刚刚输入了邮箱的历史记录；而且由于不存在写入路径，该字段永远保持为空，请求就会永远重复
      - link "context-builder.ts" [ref=f1e331] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/agent-engine/agent/context-builder.ts#L90
      - text: 。但这个提醒是
      - strong [ref=f1e332]: 条件性
      - text: 的——总是加上会教会模型怀疑正常数据，那是镜像缺陷。
    - separator [ref=f1e333]
    - heading [level=3] [ref=f1e334]:
      - link "CRM 如何被暴露为工具" [ref=f1e335] [cursor=pointer]:
        - /url: "#/pages/01?id=crm-%e5%a6%82%e4%bd%95%e8%a2%ab%e6%9a%b4%e9%9c%b2%e4%b8%ba%e5%b7%a5%e5%85%b7"
    - paragraph [ref=f1e336]: "\"底座\"要能被智能体操作，就必须有受控的接口层。这个接口是 MCP（Model Context Protocol）。"
    - paragraph [ref=f1e337]:
      - code [ref=f1e338]: lib/mcp/tools/catalogo/
      - text: 按业务领域把工具分组：漏斗、日程、客服、商业、升级、演进、治理、运营、留存
      - link "lib/mcp/tools/catalogo" [ref=f1e339] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/tree/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/tools/catalogo
      - text: 。每个工具有
      - strong [ref=f1e340]: 两套面向不同读者的描述
      - text: ——
      - code [ref=f1e341]: description
      - text: 面向模型（技术性，决定工具被如何选择），
      - code [ref=f1e342]: rotulo
      - text: /
      - code [ref=f1e343]: explicacao
      - text: /
      - code [ref=f1e344]: oQueToca
      - text: 面向配置智能体的普通人（诊所老板、店主），必须不含行话；这个门禁由一个专门的测试守着
      - link "catalog.ts" [ref=f1e345] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/tree/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/tools/catalogo
      - text: 。
    - paragraph [ref=f1e346]:
      - text: 还有一个极易被破坏的约束：工具的
      - code [ref=f1e347]: name
      - text: 是
      - strong [ref=f1e348]: 线上契约
      - text: 。客户 VPS 上已发布的智能体和外部 MCP 客户端都引用这串字符串，永不重命名已发布的工具——友好名称只是展示层
      - link "catalog.ts" [ref=f1e349] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/tree/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/tools/catalogo
      - text: 。
    - paragraph [ref=f1e350]:
      - text: MCP 服务端的执行流程同样严谨：
      - code [ref=f1e351]: createMcpServer
      - text: 为每个工具注册处理器，处理器依次检查角色与作用域、调用业务逻辑、写入
      - code [ref=f1e352]: api_audit_log
      - text: 、返回标准 MCP 内容结构
      - link "lib/mcp/server.ts" [ref=f1e353] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/server.ts#L1
      - text: 。错误以
      - code [ref=f1e354]: "{ isError: true }"
      - text: 返回，MCP 错误码放在 metadata 而非 JSON-RPC 错误封装中
      - link "lib/mcp/server.ts" [ref=f1e355] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/server.ts#L8
      - text: 。
    - paragraph [ref=f1e356]:
      - text: 值得单独指出的是一个细节：MCP 与内部智能体入口
      - strong [ref=f1e357]: 共享同一套参数净化逻辑
      - text: 。注释解释了原因——一个落在可选字段上的兜底 UUID 会变成对不存在 id 的过滤，而空结果会被读作"没有数据"；两条路径进同一个处理器，所以必须一起净化，"关上门却忘了窗户"是不允许的
      - link "lib/mcp/server.ts" [ref=f1e358] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/server.ts#L51
      - text: 。
