      - text: 。注意每层保存的内容、来源和有效期。
    - paragraph [ref=e629]: 想看 Agent：读 14 → 15 → 16 → 17 → 18 → 19 → 20 → 21，再进入记忆和知识章节。
    - paragraph [ref=e630]: 想判断是否可上线：读 26 → 27 → 28 → 35。先分清测试覆盖、证据来源和当前缺口，再看分数。
    - paragraph [ref=e631]: 正文采用短句、明确主语和一致术语。图解用于解释结构、调用与因果关系；这不是任何技术写作标准的认证，也不复制第三方书籍插图。
