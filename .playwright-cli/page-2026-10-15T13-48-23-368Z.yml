    - heading [level=3] [ref=e654]:
      - link "核心命题：什么算\"事实\"" [ref=e655] [cursor=pointer]:
        - /url: "#/pages/01?id=%e6%a0%b8%e5%bf%83%e5%91%bd%e9%a2%98%ef%bc%9a%e4%bb%80%e4%b9%88%e7%ae%97quot%e4%ba%8b%e5%ae%9equot"
    - paragraph [ref=e656]: 所谓"事实底座"，在本仓库中不是一句口号，而是由代码强制的三条规则。
    - paragraph [ref=e657]:
      - strong [ref=e658]: 第一，事实只存在于 Postgres 里。
      - text: 系统把
      - code [ref=e659]: event_log
      - text: 当作事件溯源的唯一入口，Postgres 触发器
      - strong [ref=e660]: 永不
      - text: 发起 HTTP 调用——触发器只写入一行事件，由 worker 消费并产生副作用
      - link "CLAUDE.md" [ref=e661] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/CLAUDE.md#L49
      - text: 。这条禁令消灭了"数据库里发生了一件事，但外部世界不知道"这一整类不一致状态。事实源是数据库，副作用是派生。
    - paragraph [ref=e662]:
      - strong [ref=e663]: 第二，事实的读取必须带租户作用域。
      - text: 所有 tenant-aware 表都带
      - code [ref=e664]: organization_id uuid not null
      - text: ，行级安全（RLS）通过
      - code [ref=e665]: fn_user_org_ids()
      - text: 辅助函数统一施加
      - link "ARCHITECTURE.md" [ref=e666] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/ARCHITECTURE.md#L10
      - text: 。智能体能读到哪条客户记录，取决于它以谁的身份被调用，而不是取决于模型"想"看什么。
    - paragraph [ref=e667]:
      - strong [ref=e668]: 第三，事实的写入必须留痕。
      - text: 每一次成功的 POST/PATCH/DELETE 都会产生一条
      - code [ref=e669]: api_audit_log
      - text: 记录，且该表对
      - code [ref=e670]: anon
      - text: 、
      - code [ref=e671]: authenticated
      - text: 、
      - code [ref=e672]: service_role
      - strong [ref=e673]: 都没有
      - text: UPDATE/DELETE/TRUNCATE 授权——连 service_role 也没有
      - link "CLAUDE.md" [ref=e674] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/CLAUDE.md#L89
      - text: 。这是从 schema 层保证的，不是靠提示词或纪律维持的。
    - paragraph [ref=e675]:
      - text: 这三条共同构成了"底座"：
      - strong [ref=e676]: 智能体的每一个认知都源自数据库，每一次状态改变都写回数据库并被审计
      - text: 。智能体本身是无状态的执行器，状态全部沉淀在 CRM 里。
    - separator [ref=e677]
    - heading [level=3] [ref=e678]:
      - link "智能体回合的四层契约" [ref=e679] [cursor=pointer]:
        - /url: "#/pages/01?id=%e6%99%ba%e8%83%bd%e4%bd%93%e5%9b%9e%e5%90%88%e7%9a%84%e5%9b%9b%e5%b1%82%e5%a5%91%e7%ba%a6"
    - paragraph [ref=e680]:
      - text: 智能体读取事实的过程，是整个系统最精妙也最容易被低估的部分。
      - code [ref=e681]: docs/architecture/agent-turn-pi.md
      - text: 用四层清晰定义了它
      - link "agent-turn-pi.md" [ref=e682] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/docs/architecture/agent-turn-pi.md#L3
      - text: ：
    - table [ref=e683]:
      - rowgroup [ref=e684]:
        - row [ref=e685]:
          - columnheader "层级" [ref=e686]
          - columnheader "职责" [ref=e687]
          - columnheader "关键产物" [ref=e688]
      - rowgroup [ref=e689]:
        - row [ref=e690]:
          - cell "1. CRM 组装" [ref=e691]
          - cell "构建租户作用域上下文、系统策略、记忆/RAG 结果、已发布智能体配置、能力工具" [ref=e692]
          - cell "给模型的输入" [ref=e693]
        - row [ref=e694]:
          - cell "2. 模型网关" [ref=e695]
          - cell "解析 provider / model / 凭据 / 绑定，并做预检预算决策" [ref=e696]
          - cell "模型选择 + 预算闸门" [ref=e697]
        - row [ref=e698]:
          - cell [ref=e699]:
            - text: "3."
            - code [ref=e700]: AgentRuntime.run()
          - cell "Pi Agent Core 拥有循环，CRM 回调执行前后工具策略" [ref=e701]
          - cell "生命周期与工具事件" [ref=e702]
        - row [ref=e703]:
          - cell "4. CRM 持久化" [ref=e704]
          - cell "持久化消息、用量、审计轨迹、队列状态" [ref=e705]
          - cell "回到事实层" [ref=e706]
    - paragraph [ref=e707]:
      - text: 这张表最重要的信息是
      - strong [ref=e708]: 所有权归属
      - text: ：循环归 Pi，副作用归 CRM。文档用一句话点明——发送、转人工、对外自动化仍然是 CRM 拥有的效果
      - link "agent-turn-pi.md" [ref=e709] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/docs/architecture/agent-turn-pi.md#L11
      - text: 。
    - paragraph [ref=e710]:
      - text: 侧效应用的是纵深防御，一共有五层同时生效
      - link "agent-turn-pi.md" [ref=e711] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/docs/architecture/agent-turn-pi.md#L19
      - text: ：
    - list [ref=e712]:
      - listitem [ref=e713]: 现有的 CRM 护栏留在能力处理器内部
      - listitem [ref=e714]:
        - code [ref=e715]: beforeToolCall
        - text: 可以在执行前阻断或终止
      - listitem [ref=e716]:
        - code [ref=e717]: afterToolCall
        - text: 可以脱敏/替换结果或终止整个回合
      - listitem [ref=e718]: 影子模式只允许读取类能力
      - listitem [ref=e719]: 租户与 RBAC 检查保留在数据库/API 边界
    - heading [level=4] [ref=e720]:
      - link "上下文如何被装配成提示词" [ref=e721] [cursor=pointer]:
        - /url: "#/pages/01?id=%e4%b8%8a%e4%b8%8b%e6%96%87%e5%a6%82%e4%bd%95%e8%a2%ab%e8%a3%85%e9%85%8d%e6%88%90%e6%8f%90%e7%a4%ba%e8%af%8d"
    - paragraph [ref=e722]:
      - text: 理解了上表之后，
      - code [ref=e723]: lib/agent-engine/agent/context-builder.ts
      - text: 的价值才显现——它是"事实"与"语言"之间的翻译层。函数按固定顺序装配出若干文本块：上一个回合的检查点、累积摘要、漏斗状态、线索记忆索引、已标记的日程、最近消息
      - link "context-builder.ts" [ref=e724] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/agent-engine/agent/context-builder.ts#L54
      - text: 。
    - paragraph [ref=e725]: 其中两处注释揭示了设计者对"事实如何影响模型"的深刻理解，值得逐字读：
    - paragraph [ref=e726]:
      - strong [ref=e727]: 检查点的时间戳必须被声明。
      - text: 检查点块被放在提示词的
      - strong [ref=e728]: 第一位置
      - text: ——高于历史记录，因为模型会把最前面的内容读作"最新指令"。但这个检查点其实是
      - strong [ref=e729]: 上一个回合结束时
      - text: 写的，早于客户刚发来的那条消息。注释直说：不说明这点，一个过期的检查点就会赢过与它矛盾的历史记录
      - link "context-builder.ts" [ref=e730] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/agent-engine/agent/context-builder.ts#L55
      - text: 。
    - paragraph [ref=e731]:
      - strong [ref=e732]: 字段名本身会泄漏给模型。
      - text: 漏斗状态块原本叫
      - code [ref=e733]: "## Estado do funil (lead_state)"
      - text: ，注释承认这是"免费泄漏"——模型读到表名就会复述它，而复述表名等于打开了第二条泄漏通道
      - link "context-builder.ts" [ref=e734] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/agent-engine/agent/context-builder.ts#L69
      - text: 。
    - paragraph [ref=e735]:
      - text: 还有一个更微妙的规则：
      - strong [ref=e736]: 空字段不是"信息不存在"的证据
      - text: 。当
      - code [ref=e737]: contact.email
      - text: 为空时，不把它当作事实呈现，因为模型会以"档案权威"的态度读取它，赢过客户刚刚输入了邮箱的历史记录；而且由于不存在写入路径，该字段永远保持为空，请求就会永远重复
      - link "context-builder.ts" [ref=e738] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/agent-engine/agent/context-builder.ts#L90
      - text: 。但这个提醒是
      - strong [ref=e739]: 条件性
      - text: 的——总是加上会教会模型怀疑正常数据，那是镜像缺陷。
    - separator [ref=e740]
    - heading [level=3] [ref=e741]:
      - link "CRM 如何被暴露为工具" [ref=e742] [cursor=pointer]:
        - /url: "#/pages/01?id=crm-%e5%a6%82%e4%bd%95%e8%a2%ab%e6%9a%b4%e9%9c%b2%e4%b8%ba%e5%b7%a5%e5%85%b7"
    - paragraph [ref=e743]: "\"底座\"要能被智能体操作，就必须有受控的接口层。这个接口是 MCP（Model Context Protocol）。"
    - paragraph [ref=e744]:
      - code [ref=e745]: lib/mcp/tools/catalogo/
      - text: 按业务领域把工具分组：漏斗、日程、客服、商业、升级、演进、治理、运营、留存
      - link "lib/mcp/tools/catalogo" [ref=e746] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/tree/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/tools/catalogo
      - text: 。每个工具有
      - strong [ref=e747]: 两套面向不同读者的描述
      - text: ——
      - code [ref=e748]: description
      - text: 面向模型（技术性，决定工具被如何选择），
      - code [ref=e749]: rotulo
      - text: /
      - code [ref=e750]: explicacao
      - text: /
      - code [ref=e751]: oQueToca
      - text: 面向配置智能体的普通人（诊所老板、店主），必须不含行话；这个门禁由一个专门的测试守着
      - link "catalog.ts" [ref=e752] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/tree/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/tools/catalogo
      - text: 。
    - paragraph [ref=e753]:
      - text: 还有一个极易被破坏的约束：工具的
      - code [ref=e754]: name
      - text: 是
      - strong [ref=e755]: 线上契约
      - text: 。客户 VPS 上已发布的智能体和外部 MCP 客户端都引用这串字符串，永不重命名已发布的工具——友好名称只是展示层
      - link "catalog.ts" [ref=e756] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/tree/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/tools/catalogo
      - text: 。
    - paragraph [ref=e757]:
      - text: MCP 服务端的执行流程同样严谨：
      - code [ref=e758]: createMcpServer
      - text: 为每个工具注册处理器，处理器依次检查角色与作用域、调用业务逻辑、写入
      - code [ref=e759]: api_audit_log
      - text: 、返回标准 MCP 内容结构
      - link "lib/mcp/server.ts" [ref=e760] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/server.ts#L1
      - text: 。错误以
      - code [ref=e761]: "{ isError: true }"
      - text: 返回，MCP 错误码放在 metadata 而非 JSON-RPC 错误封装中
      - link "lib/mcp/server.ts" [ref=e762] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/server.ts#L8
      - text: 。
    - paragraph [ref=e763]:
      - text: 值得单独指出的是一个细节：MCP 与内部智能体入口
      - strong [ref=e764]: 共享同一套参数净化逻辑
      - text: 。注释解释了原因——一个落在可选字段上的兜底 UUID 会变成对不存在 id 的过滤，而空结果会被读作"没有数据"；两条路径进同一个处理器，所以必须一起净化，"关上门却忘了窗户"是不允许的
      - link "lib/mcp/server.ts" [ref=e765] [cursor=pointer]:
        - /url: https://github.com/helsome/AiNativeCrm/blob/679e09e80878dff7b1c79b8537317b2b9e355331/lib/mcp/server.ts#L51
      - text: 。
